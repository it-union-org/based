[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "based"
version = "0.1.0"
description = "Modular local-first library for university bots"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.9",
]

[project.optional-dependencies]
bot = [
    "maxapi==1.2.2",
]
notes = [
    "faster-whisper>=1.0",
    "ctranslate2>=4.4",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "python-pptx>=1.0",
]
skeds = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "striprtf>=0.0.26",
    "icalendar>=6.1",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
based = "based.cli.__main__:main"
based-bot = "bot.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["based*", "bot*"]

[tool.setuptools.package-data]
based = ["config/*.yaml", "config/.env.example"]

[tool.ruff]
line-length = 100
target-version = "py311"